name: Install Section 2 keyed video

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-section2-video.yml"

permissions:
  contents: write

jobs:
  install-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download keyed theater master
        run: |
          mkdir -p public/theater
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://at.adobe.com/QZWSyghehedXIlwF" \
            -o public/theater/section-2-theater-keyed.webm
          size=$(wc -c < public/theater/section-2-theater-keyed.webm)
          echo "Downloaded $size bytes"
          test "$size" -gt 30000000

      - name: Commit keyed video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/theater/section-2-theater-keyed.webm
          git commit -m "Add keyed Section 2 theater master"
          git push
